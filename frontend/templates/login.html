{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md" x-data="{ tab: 'password', cameraActive: false, statusText: '', faceError: '', isVerifying: false }">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow-md">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Sign In to StudyBridge</h1>
      <p class="text-sm text-slate-500 mt-1">Navigate your path to global higher education</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-6 sm:p-8 shadow-sm">
      <!-- Tabs -->
      <div class="flex items-center p-1 bg-slate-100 rounded-lg mb-6 text-xs font-semibold">
        <button @click="tab = 'password'; if (cameraActive) { faceAuth.stopCamera(); cameraActive = false; }"
                :class="tab === 'password' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'"
                class="flex-1 py-2 rounded-md transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-key"></i> Password
        </button>
        <button @click="tab = 'face'"
                :class="tab === 'face' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'"
                class="flex-1 py-2 rounded-md transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-face-smile"></i> Face ID Biometric
        </button>
      </div>

      <!-- Password Login Form -->
      <form x-show="tab === 'password'" method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
          <input type="email" name="email" required placeholder="name@example.com" class="inp" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
          </div>
          <input type="password" name="password" required placeholder="Enter your password" class="inp" />
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-2.5 mt-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In with Password
        </button>
      </form>

      <!-- Face ID Biometric Login Section -->
      <div x-show="tab === 'face'" style="display:none;" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Enrolled Account Email</label>
          <input type="email" id="faceEmail" required placeholder="name@example.com" class="inp" />
        </div>

        <!-- Camera Container -->
        <div class="relative bg-slate-900 rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center border border-slate-200">
          <video id="faceVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>

          <template x-if="!cameraActive">
            <div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-900/90 text-white">
              <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-3">
                <i class="fa-solid fa-camera text-slate-400 text-lg"></i>
              </div>
              <p class="text-xs text-slate-300 font-medium">Browser camera required for biometric verification</p>
              <button @click="startFaceLogin()" class="btn-brand text-xs py-2 px-4 mt-3">
                <i class="fa-solid fa-video"></i> Start Face Camera
              </button>
            </div>
          </template>

          <template x-if="cameraActive">
            <div class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center">
              <div class="w-44 h-56 rounded-full border-2 border-dashed border-sky-400/80 animate-pulse"></div>
              <span class="absolute bottom-3 text-[11px] font-semibold bg-slate-900/80 text-white px-3 py-1 rounded-full" x-text="statusText || 'Position face within the oval'"></span>
            </div>
          </template>
        </div>

        <div x-show="faceError" class="p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
          <span x-text="faceError"></span>
        </div>

        <template x-if="cameraActive">
          <button @click="captureAndVerify()" :disabled="isVerifying" class="btn-primary w-full justify-center py-2.5">
            <i class="fa-solid fa-shield-halved" :class="isVerifying ? 'animate-spin' : ''"></i>
            <span x-text="isVerifying ? 'Verifying Neural Descriptors...' : 'Scan Face & Sign In'"></span>
          </button>
        </template>
      </div>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
        New to StudyBridge?
        <a href="{% url 'register' %}" class="font-semibold text-sky-600 hover:text-sky-700 ml-1">Create free account</a>
      </div>
    </div>
  </div>
</div>

<script>
function startFaceLogin() {
  const alpine = Alpine.$data(document.querySelector('[x-data]'));
  const video = document.getElementById('faceVideo');
  alpine.faceError = '';
  alpine.statusText = 'Starting webcam...';

  window.faceAuth.loadModels(msg => { alpine.statusText = msg; })
    .then(() => window.faceAuth.startCamera(video))
    .then(() => {
      alpine.cameraActive = true;
      alpine.statusText = 'Face centered. Click Verify.';
    })
    .catch(err => {
      alpine.cameraActive = false;
      alpine.faceError = err.message || 'Unable to access camera.';
    });
}

async function captureAndVerify() {
  const alpine = Alpine.$data(document.querySelector('[x-data]'));
  const email = document.getElementById('faceEmail').value.trim();
  if (!email) {
    alpine.faceError = 'Please enter your registered email address first.';
    return;
  }

  alpine.isVerifying = true;
  alpine.faceError = '';
  alpine.statusText = 'Extracting facial landmark vector...';

  try {
    const descriptor = await window.faceAuth.extractDescriptor();
    if (!descriptor) {
      throw new Error('No face detected. Please center your face in good lighting.');
    }

    alpine.statusText = 'Comparing biometric signatures...';

    const resp = await fetch('/verify-face/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, descriptor: descriptor })
    });
    const data = await resp.json();

    if (data.success) {
      alpine.statusText = 'Biometrics matched! Redirecting...';
      window.location.href = data.redirect || '/dashboard/';
    } else {
      alpine.faceError = data.error || 'Face verification failed.';
      alpine.statusText = 'Mismatch detected.';
    }
  } catch (err) {
    alpine.faceError = err.message || 'Error processing face verification.';
  } finally {
    alpine.isVerifying = false;
  }
}
</script>
{% endblock %}
