{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow-md">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create Your EduBridge Account</h1>
      <p class="text-xs text-slate-500 mt-1">Join ambitious students navigating global higher education</p>
    </div>

    <!-- Form Card -->
    <div class="glass rounded-2xl p-6 sm:p-8 shadow-sm">
      <form method="post" action="{% url 'register' %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Full Name</label>
          <input type="text" name="name" required placeholder="e.g. Hemanth Kumar" class="inp" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
          <input type="email" name="email" required placeholder="name@example.com" class="inp" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Account Role</label>
          <select name="role" class="inp font-semibold text-slate-800">
            <option value="student" selected>Student / Applicant</option>
            <option value="counselor">Education Counselor</option>
            <option value="mentor">Alumni Mentor</option>
            <option value="university">University Representative</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Target Degree</label>
            <select name="degree" class="inp font-semibold">
              <option value="MS" selected>MS / M.Tech</option>
              <option value="MBA">MBA</option>
              <option value="PhD">PhD / Doctorate</option>
              <option value="Bachelors">Undergraduate</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Destination</label>
            <select name="country_goal" class="inp font-semibold">
              <option value="USA" selected>USA</option>
              <option value="UK">UK</option>
              <option value="Canada">Canada</option>
              <option value="Germany">Germany</option>
              <option value="Singapore">Singapore</option>
              <option value="Australia">Australia</option>
              <option value="India">India</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
          <input type="password" name="password" required placeholder="Create a secure password" class="inp" />
        </div>

        <button type="submit" class="btn-primary w-full justify-center py-2.5 mt-2">
          <i class="fa-solid fa-user-plus"></i> Create Free Account &bull; +50 XP
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
        Already registered?
        <a href="{% url 'login' %}" class="font-semibold text-sky-600 hover:text-sky-700 ml-1">Sign In</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
