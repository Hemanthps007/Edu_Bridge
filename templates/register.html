{% extends 'base.html' %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="dot-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:64px 16px;">
  <div style="width:100%;max-width:500px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0EA5E9,#10B981);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;margin:0 auto 16px;">SB</div>
      <h1 style="font-size:2rem;font-weight:900;color:#fff;margin:0 0 8px;">Start Your Journey</h1>
      <p style="color:#64748B;">Join 50,000+ students navigating global education</p>
    </div>
    <div class="glass" style="border-radius:20px;padding:32px;">
      <form method="post" style="display:flex;flex-direction:column;gap:18px;">
        {% csrf_token %}
        <div>
          <label style="display:block;font-size:13px;font-weight:500;color:#CBD5E1;margin-bottom:8px;">Full Name</label>
          <input type="text" name="name" required placeholder="Arjun Kumar" class="inp"/>
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:500;color:#CBD5E1;margin-bottom:8px;">Email Address</label>
          <input type="email" name="email" required placeholder="arjun@example.com" class="inp"/>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <label style="display:block;font-size:13px;font-weight:500;color:#CBD5E1;margin-bottom:8px;">Target Degree</label>
            <select name="degree" class="inp">
              <option value="MS">MS / M.Tech</option>
              <option value="MBA">MBA</option>
              <option value="PhD">PhD</option>
              <option value="MIM">MIM</option>
              <option value="MEng">MEng</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:13px;font-weight:500;color:#CBD5E1;margin-bottom:8px;">Target Country</label>
            <select name="country_goal" class="inp">
              <option value="USA">USA</option>
              <option value="Canada">Canada</option>
              <option value="UK">UK</option>
              <option value="Germany">Germany</option>
              <option value="Australia">Australia</option>
            </select>
          </div>
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:500;color:#CBD5E1;margin-bottom:8px;">Password</label>
          <input type="password" name="password" required placeholder="Create a strong password" class="inp"/>
        </div>
        <button type="submit" class="btn-primary" style="justify-content:center;margin-top:4px;">
          <i class="fa-solid fa-rocket"></i> Create Free Account
        </button>
      </form>
      <p style="text-align:center;font-size:13px;color:#64748B;margin-top:20px;">
        Already have an account? <a href="{% url 'login' %}" style="color:#0EA5E9;font-weight:600;text-decoration:none;">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
