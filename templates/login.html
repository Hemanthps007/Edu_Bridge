{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md" x-data="{ tab: 'password', cameraActive: false, statusText: '', faceError: '', isVerifying: false }">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow-md">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Sign In to EduBridge</h1>
      <p class="text-sm text-slate-500 mt-1">Navigate your path to global higher education</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-6 sm:p-8 shadow-sm">
      <!-- Tabs -->
      <div class="flex items-center p-1 bg-slate-100 rounded-lg mb-6 text-xs font-semibold">
        <button @click="tab = 'password'; if (cameraActive) { faceAuth.stopCamera(); cameraActive = false; }"
                :class="tab === 'password' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'"
                class="flex-1 py-2 rounded-md transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-key"></i> Password
        </button>
        <button @click="tab = 'face'"
                :class="tab === 'face' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'"
                class="flex-1 py-2 rounded-md transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-face-smile"></i> Face ID Biometric
        </button>
      </div>

      <!-- Password Login Form -->
      <form x-show="tab === 'password'" method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="login_type" value="password"/>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email Address</label>
          <input type="email" name="email" required placeholder="you@example.com" class="inp text-xs py-2.5" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
          <input type="password" name="password" required placeholder="••••••••" class="inp text-xs py-2.5" />
        </div>
        <button type="submit" class="btn-primary w-full justify-center py-2.5 text-xs font-bold mt-2">
          Sign In <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </form>

      <!-- Face ID Login Form -->
      <div x-show="tab === 'face'" class="space-y-4 text-center">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5 text-left">Your Email Address</label>
          <input type="email" id="faceEmail" required placeholder="you@example.com" class="inp text-xs py-2.5 text-left" />
        </div>

        <div class="relative w-full aspect-[4/3] bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center border border-slate-700">
          <video id="faceVideo" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"
                 x-show="cameraActive"></video>

          <div x-show="!cameraActive" class="p-4 text-center">
            <i class="fa-solid fa-camera text-2xl text-slate-500 mb-2"></i>
            <p class="text-xs text-slate-400">Webcam required for Face ID verification</p>
          </div>

          <template x-if="cameraActive">
            <div class="absolute inset-0 pointer-events-none border-2 border-dashed border-sky-400/60 rounded-xl m-4 flex items-center justify-center">
              <div class="text-[10px] text-sky-300 bg-slate-900/80 px-2 py-0.5 rounded-full">Center Face in Oval</div>
            </div>
          </template>
        </div>

        <!-- Status message -->
        <template x-if="statusText">
          <div class="text-xs text-sky-600 font-medium flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-circle-notch fa-spin text-[10px]"></i>
            <span x-text="statusText"></span>
          </div>
        </template>
        <template x-if="faceError">
          <div class="text-xs text-rose-600 font-medium" x-text="faceError"></div>
        </template>

        <!-- Camera / Auth Action Buttons -->
        <template x-if="!cameraActive">
          <button @click="startFaceLogin()" type="button" class="btn-secondary w-full justify-center text-xs py-2.5 font-bold">
            <i class="fa-solid fa-video"></i> Enable Camera
          </button>
        </template>
        <template x-if="cameraActive">
          <button @click="captureAndVerify()" :disabled="isVerifying" type="button" class="btn-brand w-full justify-center text-xs py-2.5 font-bold">
            <i class="fa-solid fa-shield-halved"></i> Verify & Sign In
          </button>
        </template>
      </div>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
        New to EduBridge?
        <a href="{% url 'register' %}" class="font-semibold text-sky-600 hover:text-sky-700 ml-1">Create free account</a>
      </div>
    </div>
  </div>
</div>

{% load static %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
